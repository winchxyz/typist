<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typist: welcome hero options</title>
<!-- Welcome hero line-up (dev only). The welcome screen as the app draws it (index.html markup,
     css/app.css), with one of four hero options in #welcomeArt:
       ?opt=A|B|C|D  ;theme=light|dark  ;w=..;h=.. (informational)  ;sheet=1 (look contact sheet)
     Shots: node dev/hero-shot.mjs [--opts A,B] [--variants desk-dark,phone-light,phone-dark] -->
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../css/app.css">
<style>
  /* ---- hero options: the stage above the sheet (phones) or beside the card (wide) ---- */
  body.welcoming .welcome-art { padding: 12px 16px; }
  .welcome-art > * { flex: none; }
  .hero-frame { position: relative; display: block; }
  .hero-frame canvas { display: block; }
  .hero-split { border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px var(--border), var(--shadow-paper); background: var(--surface); }
  .hero-chat { transform-origin: 50% 50%; }
  .hero-cap { position: absolute; left: 12px; bottom: 10px; font: 500 11.5px/1 var(--sans); letter-spacing: .02em;
    padding: 5px 8px; border-radius: 999px; background: rgba(20, 20, 22, .62); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .hero-cap.r { left: auto; right: 12px; background: var(--text); color: var(--surface); }

  /* wide screens (the user's 785 px pane and up): hero and card side by side, so the art gets
     the whole height instead of the ~170 px strip left above a full-width sheet */
  @media (min-width: 700px) {
    body.welcoming .welcome-art {
      left: 0; right: calc(var(--card-w) + 2 * var(--gut)); top: var(--top-h); bottom: 0; padding: var(--gut) 0 var(--gut) var(--gut);
    }
    :root { --card-w: 392px; --gut: 24px; }
    .welcome, body .welcome {
      left: auto; right: var(--gut); bottom: auto; top: calc(50% + var(--top-h) / 2); width: var(--card-w);
      transform: translateY(-50%); border-radius: var(--radius-sheet); border: 1px solid var(--border);
      box-shadow: var(--shadow-pop); padding: 22px 20px 16px; max-height: calc(100dvh - var(--top-h) - 2 * var(--gut) + 20px);
      animation: riseW .32s var(--ease);
    }
    @keyframes riseW { from { opacity: 0; transform: translateY(calc(-50% + 16px)); } to { opacity: 1; transform: translateY(-50%); } }
    .welcome h1 { font-size: 38px; }
    .samples { max-width: 340px; }
  }
  @media (min-width: 1024px) {
    :root { --card-w: 440px; --gut: 40px; }
    body.welcoming .welcome-art { bottom: 0; }
  }

  /* contact sheet mode */
  body.sheet { overflow: auto; height: auto; }
  body.sheet .app, body.sheet .welcome, body.sheet .welcome-art { display: none !important; }
</style>
</head>
<body class="welcoming">
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></g></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-4.5-4.5L8 20"/></g></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.5-2h4.4l1.5 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5Z"/><circle cx="12" cy="12.5" r="3.5"/></g></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></g></symbol>
</svg>

<div class="app" id="app">
  <header class="topbar">
    <a class="brand" href="./hero.html" aria-label="Typist, start over"><span class="wordmark">Typist</span></a>
    <a class="byline show-lg" href="https://x.com/winchxyz" target="_blank" rel="noopener">by @winchxyz</a>
    <span class="spacer"></span>
    <div class="menu-wrap">
      <button type="button" class="icon-btn" id="btnMenu" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
    </div>
  </header>
</div>

<div class="welcome-art" id="welcomeArt" aria-hidden="true"></div>
<section class="welcome" id="welcome" aria-labelledby="welcomeTitle">
  <h1 id="welcomeTitle">Any photo. <em>In text.</em></h1>
  <p class="lede">Text art you can paste into a comment, a post or a chat.</p>
  <div class="w-label" id="wTargetsLabel">Where will you paste it?</div>
  <div class="w-targets" id="welcomeTargets" role="radiogroup" aria-labelledby="wTargetsLabel">
    <button type="button" class="wtile" role="radio" aria-checked="true" data-v="ig"><b>Instagram comment</b><span>2,200 characters</span></button>
    <button type="button" class="wtile" role="radio" aria-checked="false" data-v="x"><b>X post</b><span>280, or 25,000 with Premium</span></button>
    <button type="button" class="wtile" role="radio" aria-checked="false" data-v="tg"><b>Telegram</b><span>4,096 characters</span></button>
    <button type="button" class="wtile" role="radio" aria-checked="false" data-v="tgc"><b>Telegram channel</b><span>4,096 characters</span></button>
  </div>
  <button type="button" class="link-btn" id="wFile" role="radio" aria-checked="false">Just save a file</button>
  <div class="w-actions">
    <button type="button" class="btn primary big grow" id="btnChoose"><svg class="ic"><use href="#i-image"/></svg>Choose a photo</button>
    <button type="button" class="btn secondary big touch-only" id="btnCamera"><svg class="ic"><use href="#i-camera"/></svg>Take a photo</button>
  </div>
  <div class="w-label">Or try one of these</div>
  <div class="samples" id="samples"></div>
  <p class="privacy"><svg class="ic"><use href="#i-lock"/></svg><span>Runs in your browser. Your photo is never uploaded.</span><span class="byline-w">by <a href="https://x.com/winchxyz" target="_blank" rel="noopener">@winchxyz</a></span></p>
</section>

<script type="module" src="hero.js"></script>
</body>
</html>
