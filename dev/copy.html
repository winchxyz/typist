<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typist copy + export bench</title>
<style>
  :root { color-scheme: light; }
  body { margin: 16px; background: #eceae4; color: #17171a; font: 13px/1.4 system-ui, sans-serif; }
  h1 { font: italic 22px/1.2 Georgia, serif; margin: 0 0 12px; }
  #cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  #cases button { font: inherit; text-align: left; padding: 10px 12px; border: 1px solid #c9c5bc; border-radius: 10px;
                  background: #faf9f6; cursor: pointer; min-height: 44px; }
  #cases button small { display: block; color: #6b6962; }
  #paste { width: 100%; height: 60px; margin-top: 12px; font: 11px ui-monospace, monospace; }
  #log { font: 11px/1.35 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .sheet { display: grid; grid-template-columns: 170px repeat(3, 1fr); gap: 10px; align-items: start; }
  .sheet > div { background: #faf9f6; border: 1px solid #d9d5cc; border-radius: 10px; padding: 8px; overflow: hidden; }
  .sheet .head { background: none; border: 0; font-weight: 600; padding: 4px 0; }
  .sheet .label { font-weight: 600; }
  .sheet .label small { display: block; font-weight: 400; color: #6b6962; margin-top: 4px; }
  .sheet img { display: block; max-width: 100%; height: auto; }
  .sheet iframe { display: block; width: 100%; height: 300px; border: 0; background: #fff; }
  .meta { font: 11px ui-monospace, Consolas, monospace; color: #6b6962; margin-top: 6px; }
</style>
</head>
<body>
<!-- Bench for js/copy.js and js/export.js (driven by tests/copy.e2e.mjs).
       /dev/copy.html                      buttons, one per case; click -> copyFor(), result in window.__last
       ?device=phone|desktop|auto          what copyFor is told about the pointer (default desktop)
       ?deny=all|async                     clipboard refused (all: + execCommand fails -> manual)
       ?block=1                            window.open returns null (popup blocker)
       ?share=ok|abort|fail                navigator.share stub (phones)
       /dev/copy.html?sheet=export         PNG | SVG | HTML of the pet in every mode, side by side -->
<h1>Copy + export bench</h1>
<div id="cases"></div>
<textarea id="paste" aria-label="Paste target" placeholder="paste here"></textarea>
<div id="out"></div>
<pre id="log"></pre>
<script type="module" src="./copy.js"></script>
</body>
</html>
